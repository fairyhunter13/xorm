dependencies:
  override:
    # './...' is a relative pattern which means all subdirectories
    - go get -t -d -v ./...
    - go get -t -d -v github.com/go-xorm/tests
    - go build -v

database:
  override:
    - mysql -u root -e "CREATE DATABASE ***REMOVED*** DEFAULT CHARACTER SET utf8 COLLATE utf8_general_ci"
    - mysql -u root -e "CREATE DATABASE ***REMOVED***1 DEFAULT CHARACTER SET utf8 COLLATE utf8_general_ci"
    - mysql -u root -e "CREATE DATABASE ***REMOVED***2 DEFAULT CHARACTER SET utf8 COLLATE utf8_general_ci"
    - mysql -u root -e "CREATE DATABASE ***REMOVED***3 DEFAULT CHARACTER SET utf8 COLLATE utf8_general_ci"
    - createdb -p 5432 -e -U ***REMOVED*** ***REMOVED***
    - createdb -p 5432 -e -U ***REMOVED*** ***REMOVED***1
    - createdb -p 5432 -e -U ***REMOVED*** ***REMOVED***2
    - createdb -p 5432 -e -U ***REMOVED*** ***REMOVED***3

test:
  override:
    # './...' is a relative pattern which means all subdirectories
    - go test -v -race
    - cd /home/ubuntu/.go_workspace/src/github.com/go-xorm/tests && ./sqlite3.sh
    - cd /home/ubuntu/.go_workspace/src/github.com/go-xorm/tests && ./mysql.sh
    - cd /home/ubuntu/.go_workspace/src/github.com/go-xorm/tests && ./***REMOVED***.sh